# _quarto.yml — Reference configuration for publishing on GitHub Pages from /docs
#
# Usage:
#   1. Copy this file to your project root as _quarto.yml
#   2. Run: mkdir -p docs && touch .nojekyll docs/.nojekyll
#   3. Run: quarto render
#   4. Commit and push — GitHub Pages serves from docs/
#
# GitHub Pages settings:
#   Settings → Pages → Source: Deploy from branch
#   Branch: main (or your default) | Folder: /docs

project:
  type: default
  output-dir: docs

# Apply auto-dark-html as the default format for all .qmd files.
# Individual files can override this in their YAML header.
format:
  auto-dark-html:
    toc: true
    toc-depth: 2

# Global execution options (override per-chunk as needed)
execute:
  echo: false
  warning: false
  message: false
